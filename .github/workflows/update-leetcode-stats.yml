name: Update LeetCode Statistics

on:
push:
branches:
- main
paths-ignore:
- "README.md"

workflow_dispatch:

permissions:
contents: write

jobs:
update-stats:
name: Calculate LeetCode Statistics
runs-on: ubuntu-latest

```
steps:

  # ------------------------------------------------------------
  # Checkout repository
  # ------------------------------------------------------------

  - name: Checkout repository
    uses: actions/checkout@v4
    with:
      fetch-depth: 0

  # ------------------------------------------------------------
  # Setup Python
  # ------------------------------------------------------------

  - name: Setup Python
    uses: actions/setup-python@v5
    with:
      python-version: "3.x"

  # ------------------------------------------------------------
  # Install dependencies
  # ------------------------------------------------------------

  - name: Install dependencies
    run: |
      python -m pip install --upgrade pip
      pip install requests

  # ------------------------------------------------------------
  # Calculate statistics and update README
  # ------------------------------------------------------------

  - name: Update LeetCode statistics
    env:
      LEETCODE_API_URL: https://leetcode.com/api/problems/all/
    run: |

      python <<'PY'

      import re
      import requests
      from pathlib import Path


      # ============================================================
      # Configuration
      # ============================================================

      README = Path("README.md")

      SOLUTION_EXTENSIONS = {
          ".cpp",
          ".cc",
          ".c",
          ".java",
          ".py",
          ".js",
          ".ts",
          ".sql",
          ".go",
          ".rs",
          ".cs"
      }

      API_URL = "https://leetcode.com/api/problems/all/"


      # ============================================================
      # Find all solution files
      # ============================================================

      problem_ids = set()

      print("\nScanning repository for solution files...\n")

      for path in Path(".").rglob("*"):

          if not path.is_file():
              continue

          # Ignore hidden directories such as .git and .github
          if any(part.startswith(".") for part in path.parts):
              continue

          if path.suffix.lower() not in SOLUTION_EXTENSIONS:
              continue

          # Accept:
          #
          # 123-Problem.cpp
          # 123.Problem.cpp
          # 123 Problem.cpp
          #
          # The number must be at the beginning of the filename.

          match = re.match(
              r"^\s*(\d+)\s*[-._ ]",
              path.name
          )

          if not match:
              continue

          problem_id = int(match.group(1))

          problem_ids.add(problem_id)

          print(f"Found: {path.name} -> Problem #{problem_id}")


      print("\n----------------------------------------")
      print(f"Unique problems found: {len(problem_ids)}")
      print("----------------------------------------\n")


      # ============================================================
      # Fetch LeetCode problem data
      # ============================================================

      headers = {
          "User-Agent": "Mozilla/5.0",
          "Accept": "application/json",
          "Referer": "https://leetcode.com/"
      }

      print("Fetching LeetCode problem data...")

      response = requests.get(
          API_URL,
          headers=headers,
          timeout=60
      )

      response.raise_for_status()

      data = response.json()


      # ============================================================
      # Create problem difficulty lookup
      # ============================================================

      difficulty_map = {}

      for item in data.get("stat_status_pairs", []):

          stat = item.get("stat", {})
          difficulty_data = item.get("difficulty", {})

          question_id = stat.get("frontend_question_id")
          difficulty = difficulty_data.get("level")

          if question_id is None:
              continue

          if difficulty is None:
              continue

          try:
              question_id = int(question_id)
          except (TypeError, ValueError):
              continue

          difficulty_map[question_id] = difficulty


      # ============================================================
      # Count difficulties
      # ============================================================

      easy = 0
      medium = 0
      hard = 0

      unknown = []

      for problem_id in sorted(problem_ids):

          difficulty = difficulty_map.get(problem_id)

          if difficulty == 1:
              easy += 1

          elif difficulty == 2:
              medium += 1

          elif difficulty == 3:
              hard += 1

          else:
              unknown.append(problem_id)


      total = len(problem_ids)


      # ============================================================
      # Display statistics
      # ============================================================

      print("\n========================================")
      print("        LEETCODE STATISTICS")
      print("========================================")
      print(f"Total Problems : {total}")
      print(f"Easy           : {easy}")
      print(f"Medium         : {medium}")
      print(f"Hard           : {hard}")
      print("========================================\n")


      if unknown:

          print(
              "WARNING: Difficulty could not be determined for:"
          )

          print(
              ", ".join(
                  str(problem_id)
                  for problem_id in unknown
              )
          )

          print(
              "\nThese problems are still included in TOTAL."
          )


      # ============================================================
      # Read README
      # ============================================================

      if not README.exists():

          raise FileNotFoundError(
              "README.md was not found."
          )

      readme = README.read_text(
          encoding="utf-8"
      )


      # ============================================================
      # Helper function for replacing README markers
      # ============================================================

      def update_marker(
          text,
          start_marker,
          end_marker,
          value
      ):

          pattern = (
              re.escape(start_marker)
              + r".*?"
              + re.escape(end_marker)
          )

          replacement = (
              start_marker
              + str(value)
              + end_marker
          )

          updated, count = re.subn(
              pattern,
              replacement,
              text,
              count=1,
              flags=re.DOTALL
          )

          if count != 1:

              raise RuntimeError(
                  f"Could not find README markers: "
                  f"{start_marker} ... {end_marker}"
              )

          return updated


      # ============================================================
      # Update main statistics
      # ============================================================

      readme = update_marker(
          readme,
          "<!-- TOTAL_START -->",
          "<!-- TOTAL_END -->",
          total
      )

      readme = update_marker(
          readme,
          "<!-- EASY_START -->",
          "<!-- EASY_END -->",
          easy
      )

      readme = update_marker(
          readme,
          "<!-- MEDIUM_START -->",
          "<!-- MEDIUM_END -->",
          medium
      )

      readme = update_marker(
          readme,
          "<!-- HARD_START -->",
          "<!-- HARD_END -->",
          hard
      )


      # ============================================================
      # Update difficulty progress section
      # ============================================================

      readme = update_marker(
          readme,
          "<!-- EASY_PROGRESS_START -->",
          "<!-- EASY_PROGRESS_END -->",
          easy
      )

      readme = update_marker(
          readme,
          "<!-- MEDIUM_PROGRESS_START -->",
          "<!-- MEDIUM_PROGRESS_END -->",
          medium
      )

      readme = update_marker(
          readme,
          "<!-- HARD_PROGRESS_START -->",
          "<!-- HARD_PROGRESS_END -->",
          hard
      )


      # ============================================================
      # Save README
      # ============================================================

      README.write_text(
          readme,
          encoding="utf-8"
      )

      print("\nREADME successfully updated! 🚀")

      PY

  # ------------------------------------------------------------
  # Commit README if statistics changed
  # ------------------------------------------------------------

  - name: Commit updated README
    run: |

      git config user.name "github-actions[bot]"

      git config user.email \
        "41898282+github-actions[bot]@users.noreply.github.com"

      git add README.md

      if git diff --cached --quiet; then

        echo "No README changes detected."

      else

        git commit \
          -m "chore: update LeetCode statistics"

        git push

      fi
```
