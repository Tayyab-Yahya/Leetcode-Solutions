name: Update LeetCode Statistics

on:
  push:
    branches:
      - main
    paths-ignore:
      - "README.md"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-stats:
    name: Calculate LeetCode Statistics
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Calculate LeetCode statistics
        run: |
          python <<'PY'
          import re
          import sys
          import requests
          from pathlib import Path

          README = Path("README.md")

          EXTENSIONS = {
              ".cpp",
              ".cc",
              ".c",
              ".java",
              ".py",
              ".js",
              ".ts",
              ".sql",
              ".go",
              ".rs",
              ".cs"
          }

          # ============================================================
          # 1. Find solution files
          # ============================================================

          problem_ids = set()

          print("=" * 60)
          print("SCANNING REPOSITORY")
          print("=" * 60)

          for path in Path(".").rglob("*"):

              if not path.is_file():
                  continue

              # Ignore hidden directories
              if any(part.startswith(".") for part in path.parts):
                  continue

              if path.suffix.lower() not in EXTENSIONS:
                  continue

              # Supports:
              # 1-Two Sum.cpp
              # 1.Two Sum.cpp
              # 1 Two Sum.cpp
              # 001-Two Sum.cpp

              match = re.match(
                  r"^(\d+)\s*[-._ ]",
                  path.name
              )

              if match:
                  problem_id = int(match.group(1))
                  problem_ids.add(problem_id)

                  print(
                      f"Found: {path.name} -> #{problem_id}"
                  )

          print()
          print(f"Unique problems found: {len(problem_ids)}")
          print()

          if not problem_ids:
              print("ERROR: No solution files found.")
              sys.exit(1)

          # ============================================================
          # 2. LeetCode GraphQL
          # ============================================================

          GRAPHQL_URL = "https://leetcode.com/graphql/"

          LIST_QUERY = """
          query problemsetQuestionList(
              $categorySlug: String
              $limit: Int
              $skip: Int
          ) {
              problemsetQuestionList(
                  categorySlug: $categorySlug
                  limit: $limit
                  skip: $skip
              ) {
                  total
                  questions {
                      questionFrontendId
                      title
                      titleSlug
                      difficulty
                  }
              }
          }
          """

          HEADERS = {
              "Content-Type": "application/json",
              "User-Agent": "Mozilla/5.0",
              "Referer": "https://leetcode.com/"
          }

          session = requests.Session()
          session.headers.update(HEADERS)

          # ============================================================
          # 3. Download LeetCode problem list
          # ============================================================

          print("=" * 60)
          print("FETCHING LEETCODE DATA")
          print("=" * 60)

          slug_map = {}

          limit = 100
          skip = 0

          while True:

              payload = {
                  "query": LIST_QUERY,
                  "variables": {
                      "categorySlug": "",
                      "limit": limit,
                      "skip": skip
                  }
              }

              response = session.post(
                  GRAPHQL_URL,
                  json=payload,
                  timeout=60
              )

              print(
                  f"HTTP Status: {response.status_code}"
              )

              response.raise_for_status()

              result = response.json()

              if "errors" in result:
                  print("LeetCode GraphQL error:")
                  print(result["errors"])
                  sys.exit(1)

              problemset = (
                  result
                  .get("data", {})
                  .get("problemsetQuestionList")
              )

              if not problemset:
                  print("ERROR: No LeetCode problem data.")
                  print(result)
                  sys.exit(1)

              questions = problemset.get(
                  "questions",
                  []
              )

              total_available = problemset.get(
                  "total",
                  0
              )

              for question in questions:

                  question_id = question.get(
                      "questionFrontendId"
                  )

                  slug = question.get(
                      "titleSlug"
                  )

                  if question_id and slug:
                      try:
                          slug_map[int(question_id)] = slug
                      except ValueError:
                          pass

              print(
                  f"Loaded {len(slug_map)} problems..."
              )

              if (
                  not questions
                  or skip + len(questions) >= total_available
              ):
                  break

              skip += limit

          print()
          print(
              f"Total LeetCode problems loaded: "
              f"{len(slug_map)}"
          )
          print()

          # ============================================================
          # 4. Get difficulty for our problems
          # ============================================================

          QUESTION_QUERY = """
          query questionData($titleSlug: String!) {
              question(titleSlug: $titleSlug) {
                  questionFrontendId
                  difficulty
                  title
                  titleSlug
              }
          }
          """

          easy = 0
          medium = 0
          hard = 0

          unknown = []

          print("=" * 60)
          print("CHECKING DIFFICULTIES")
          print("=" * 60)

          for problem_id in sorted(problem_ids):

              slug = slug_map.get(problem_id)

              if not slug:
                  print(
                      f"#{problem_id}: NOT FOUND"
                  )
                  unknown.append(problem_id)
                  continue

              payload = {
                  "query": QUESTION_QUERY,
                  "variables": {
                      "titleSlug": slug
                  }
              }

              response = session.post(
                  GRAPHQL_URL,
                  json=payload,
                  timeout=60
              )

              response.raise_for_status()

              result = response.json()

              if "errors" in result:
                  print(
                      f"#{problem_id}: API ERROR"
                  )
                  unknown.append(problem_id)
                  continue

              question = (
                  result
                  .get("data", {})
                  .get("question")
              )

              if not question:
                  print(
                      f"#{problem_id}: NOT FOUND"
                  )
                  unknown.append(problem_id)
                  continue

              difficulty = question.get(
                  "difficulty"
              )

              print(
                  f"#{problem_id}: {difficulty}"
              )

              if difficulty == "Easy":
                  easy += 1

              elif difficulty == "Medium":
                  medium += 1

              elif difficulty == "Hard":
                  hard += 1

              else:
                  unknown.append(problem_id)

          total = len(problem_ids)

          # ============================================================
          # 5. Print final statistics
          # ============================================================

          print()
          print("=" * 60)
          print("FINAL STATISTICS")
          print("=" * 60)
          print(f"Total  : {total}")
          print(f"Easy   : {easy}")
          print(f"Medium : {medium}")
          print(f"Hard   : {hard}")
          print("=" * 60)

          if unknown:
              print()
              print(
                  "Could not determine difficulty for:"
              )
              print(
                  ", ".join(
                      str(x)
                      for x in unknown
                  )
              )

          # ============================================================
          # 6. Read README
          # ============================================================

          if not README.exists():
              print("ERROR: README.md not found.")
              sys.exit(1)

          readme = README.read_text(
              encoding="utf-8"
          )

          # ============================================================
          # 7. Replace README statistics
          # ============================================================

          def replace_marker(
              text,
              start_marker,
              end_marker,
              value
          ):

              pattern = (
                  re.escape(start_marker)
                  + r".*?"
                  + re.escape(end_marker)
              )

              replacement = (
                  start_marker
                  + str(value)
                  + end_marker
              )

              updated, count = re.subn(
                  pattern,
                  replacement,
                  text,
                  count=1,
                  flags=re.DOTALL
              )

              if count != 1:
                  raise RuntimeError(
                      f"README marker missing: "
                      f"{start_marker}"
                  )

              return updated

          # Main table

          readme = replace_marker(
              readme,
              "<!-- TOTAL_START -->",
              "<!-- TOTAL_END -->",
              total
          )

          readme = replace_marker(
              readme,
              "<!-- EASY_START -->",
              "<!-- EASY_END -->",
              easy
          )

          readme = replace_marker(
              readme,
              "<!-- MEDIUM_START -->",
              "<!-- MEDIUM_END -->",
              medium
          )

          readme = replace_marker(
              readme,
              "<!-- HARD_START -->",
              "<!-- HARD_END -->",
              hard
          )

          # Difficulty section

          readme = replace_marker(
              readme,
              "<!-- EASY_PROGRESS_START -->",
              "<!-- EASY_PROGRESS_END -->",
              easy
          )

          readme = replace_marker(
              readme,
              "<!-- MEDIUM_PROGRESS_START -->",
              "<!-- MEDIUM_PROGRESS_END -->",
              medium
          )

          readme = replace_marker(
              readme,
              "<!-- HARD_PROGRESS_START -->",
              "<!-- HARD_PROGRESS_END -->",
              hard
          )

          # ============================================================
          # 8. Save README
          # ============================================================

          README.write_text(
              readme,
              encoding="utf-8"
          )

          print()
          print("README successfully updated!")

          PY

      - name: Commit updated README
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add README.md

          if git diff --cached --quiet; then
            echo "No README changes."
          else
            git commit -m "chore: update LeetCode statistics"
            git push
          fi