name: Update LeetCode Statistics

on:
  push:
    branches:
      - main
    paths-ignore:
      - "README.md"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-stats:
    name: Update LeetCode Statistics
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Calculate LeetCode Statistics
        run: |

          python <<'PY'

          import re
          import sys
          import json
          import requests
          from pathlib import Path


          # ============================================================
          # CONFIGURATION
          # ============================================================

          README = Path("README.md")

          DATABASE_URL = (
              "https://raw.githubusercontent.com/"
              "neenza/leetcode-problems/master/"
              "merged_problems.json"
          )

          EXTENSIONS = {
              ".cpp",
              ".cc",
              ".c",
              ".java",
              ".py",
              ".js",
              ".ts",
              ".sql",
              ".go",
              ".rs",
              ".cs"
          }


          # ============================================================
          # STEP 1 — FIND SOLUTION FILES
          # ============================================================

          print("=" * 60)
          print("SCANNING SOLUTION FILES")
          print("=" * 60)

          problem_ids = set()

          for path in Path(".").rglob("*"):

              if not path.is_file():
                  continue

              # Ignore hidden directories
              if any(
                  part.startswith(".")
                  for part in path.parts
              ):
                  continue

              if path.suffix.lower() not in EXTENSIONS:
                  continue

              # Supported formats:
              #
              # 1-Two Sum.cpp
              # 1.Two Sum.java
              # 1 Two Sum.py
              # 001-Two Sum.cpp

              match = re.match(
                  r"^(\d+)\s*[-._ ]",
                  path.name
              )

              if match:

                  problem_id = int(
                      match.group(1)
                  )

                  problem_ids.add(
                      problem_id
                  )

                  print(
                      f"Found: {path.name} "
                      f"-> #{problem_id}"
                  )


          total = len(problem_ids)

          print()
          print(
              f"Total unique problems found: {total}"
          )
          print()


          if total == 0:

              print(
                  "ERROR: No LeetCode solution files found."
              )

              sys.exit(1)


          # ============================================================
          # STEP 2 — DOWNLOAD LEETCODE DATABASE
          # ============================================================

          print("=" * 60)
          print("DOWNLOADING LEETCODE DATABASE")
          print("=" * 60)

          response = requests.get(
              DATABASE_URL,
              timeout=120
          )

          print(
              f"HTTP Status: {response.status_code}"
          )

          response.raise_for_status()

          problems = response.json()

          print(
              f"Database downloaded successfully."
          )

          print(
              f"Problems in database: "
              f"{len(problems)}"
          )

          print()


          # ============================================================
          # STEP 3 — BUILD DIFFICULTY MAP
          # ============================================================

          print("=" * 60)
          print("BUILDING DIFFICULTY MAP")
          print("=" * 60)

          difficulty_map = {}

          for problem in problems:

              frontend_id = problem.get(
                  "frontend_id"
              )

              difficulty = problem.get(
                  "difficulty"
              )

              if not frontend_id:
                  continue

              try:

                  frontend_id = int(
                      frontend_id
                  )

              except (
                  ValueError,
                  TypeError
              ):

                  continue

              if difficulty in {
                  "Easy",
                  "Medium",
                  "Hard"
              }:

                  difficulty_map[
                      frontend_id
                  ] = difficulty


          print(
              f"Difficulty entries loaded: "
              f"{len(difficulty_map)}"
          )

          print()


          # ============================================================
          # STEP 4 — COUNT DIFFICULTIES
          # ============================================================

          easy = 0
          medium = 0
          hard = 0

          unknown = []


          print("=" * 60)
          print("CHECKING PROBLEM DIFFICULTIES")
          print("=" * 60)


          for problem_id in sorted(
              problem_ids
          ):

              difficulty = difficulty_map.get(
                  problem_id
              )


              if difficulty == "Easy":

                  easy += 1


              elif difficulty == "Medium":

                  medium += 1


              elif difficulty == "Hard":

                  hard += 1


              else:

                  unknown.append(
                      problem_id
                  )


              print(
                  f"#{problem_id}: "
                  f"{difficulty or 'NOT FOUND'}"
              )


          print()


          # ============================================================
          # STEP 5 — FINAL STATISTICS
          # ============================================================

          print("=" * 60)
          print("FINAL LEETCODE STATISTICS")
          print("=" * 60)

          print(
              f"Total  : {total}"
          )

          print(
              f"Easy   : {easy}"
          )

          print(
              f"Medium : {medium}"
          )

          print(
              f"Hard   : {hard}"
          )

          print("=" * 60)


          if unknown:

              print()

              print(
                  "WARNING: Difficulty not found for:"
              )

              print(
                  ", ".join(
                      str(x)
                      for x in unknown
                  )
              )


          # ============================================================
          # STEP 6 — READ README
          # ============================================================

          if not README.exists():

              print(
                  "ERROR: README.md not found."
              )

              sys.exit(1)


          readme = README.read_text(
              encoding="utf-8"
          )


          # ============================================================
          # STEP 7 — UPDATE README
          # ============================================================

          def replace_marker(
              text,
              start_marker,
              end_marker,
              value
          ):

              pattern = (
                  re.escape(start_marker)
                  +
                  r".*?"
                  +
                  re.escape(end_marker)
              )

              replacement = (
                  start_marker
                  +
                  str(value)
                  +
                  end_marker
              )

              updated, count = re.subn(
                  pattern,
                  replacement,
                  text,
                  count=1,
                  flags=re.DOTALL
              )


              if count != 1:

                  raise RuntimeError(
                      "README marker not found: "
                      +
                      start_marker
                  )


              return updated


          # ------------------------------------------------------------
          # Main statistics table
          # ------------------------------------------------------------

          readme = replace_marker(
              readme,
              "<!-- TOTAL_START -->",
              "<!-- TOTAL_END -->",
              total
          )


          readme = replace_marker(
              readme,
              "<!-- EASY_START -->",
              "<!-- EASY_END -->",
              easy
          )


          readme = replace_marker(
              readme,
              "<!-- MEDIUM_START -->",
              "<!-- MEDIUM_END -->",
              medium
          )


          readme = replace_marker(
              readme,
              "<!-- HARD_START -->",
              "<!-- HARD_END -->",
              hard
          )


          # ------------------------------------------------------------
          # Difficulty breakdown
          # ------------------------------------------------------------

          readme = replace_marker(
              readme,
              "<!-- EASY_PROGRESS_START -->",
              "<!-- EASY_PROGRESS_END -->",
              easy
          )


          readme = replace_marker(
              readme,
              "<!-- MEDIUM_PROGRESS_START -->",
              "<!-- MEDIUM_PROGRESS_END -->",
              medium
          )


          readme = replace_marker(
              readme,
              "<!-- HARD_PROGRESS_START -->",
              "<!-- HARD_PROGRESS_END -->",
              hard
          )


          # ============================================================
          # STEP 8 — SAVE README
          # ============================================================

          README.write_text(
              readme,
              encoding="utf-8"
          )


          print()
          print(
              "README successfully updated!"
          )

          PY


      # ================================================================
      # COMMIT README
      # ================================================================

      - name: Commit updated README
        run: |

          git config user.name \
            "github-actions[bot]"

          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add README.md


          if git diff --cached --quiet; then

              echo "No README changes."

          else

              git commit \
                -m "chore: update LeetCode statistics"

              git push

          fi