name: Update LeetCode Statistics

on:
push:
branches:
- main
paths-ignore:
- "README.md"

workflow_dispatch:

permissions:
contents: write

jobs:
update-stats:
name: Update LeetCode Statistics
runs-on: ubuntu-latest

```
steps:

  # ------------------------------------------------------------
  # Checkout repository
  # ------------------------------------------------------------

  - name: Checkout repository
    uses: actions/checkout@v4

  # ------------------------------------------------------------
  # Setup Python
  # ------------------------------------------------------------

  - name: Setup Python
    uses: actions/setup-python@v5
    with:
      python-version: "3.x"

  # ------------------------------------------------------------
  # Install dependencies
  # ------------------------------------------------------------

  - name: Install dependencies
    run: |
      python -m pip install --upgrade pip
      pip install requests

  # ------------------------------------------------------------
  # Calculate statistics
  # ------------------------------------------------------------

  - name: Calculate LeetCode statistics
    run: |

      python <<'PY'

      import re
      import requests
      from pathlib import Path


      # ============================================================
      # Configuration
      # ============================================================

      README = Path("README.md")

      EXTENSIONS = {
          ".cpp",
          ".cc",
          ".c",
          ".java",
          ".py",
          ".js",
          ".ts",
          ".sql",
          ".go",
          ".rs",
          ".cs"
      }


      # ============================================================
      # STEP 1 — Find solution files
      # ============================================================

      print("")
      print("==============================================")
      print("   SCANNING LEETCODE SOLUTIONS")
      print("==============================================")
      print("")

      problem_ids = set()

      for path in Path(".").rglob("*"):

          if not path.is_file():
              continue

          # Ignore hidden folders such as .git and .github
          if any(part.startswith(".") for part in path.parts):
              continue

          if path.suffix.lower() not in EXTENSIONS:
              continue

          # Supported filename formats:
          #
          # 1-Two Sum.cpp
          # 1.Two Sum.cpp
          # 1 Two Sum.cpp
          # 0001-Two Sum.cpp
          #
          # Number MUST be at the beginning.

          match = re.match(
              r"^\s*(\d+)\s*[-._ ]",
              path.name
          )

          if match:

              problem_id = int(match.group(1))

              problem_ids.add(problem_id)

              print(
                  f"✓ {path.name} "
                  f"→ Problem #{problem_id}"
              )


      print("")
      print("----------------------------------------------")
      print(
          f"Unique problems found: {len(problem_ids)}"
      )
      print("----------------------------------------------")
      print("")


      # ============================================================
      # STEP 2 — Get LeetCode problem data
      # ============================================================

      print(
          "Fetching problem data from LeetCode..."
      )

      graphql_url = "https://leetcode.com/graphql/"


      query = """
      query problemsetQuestionList(
          $categorySlug: String
          $limit: Int
          $skip: Int
      ) {
          problemsetQuestionList(
              categorySlug: $categorySlug
              limit: $limit
              skip: $skip
          ) {
              total
              questions {
                  questionFrontendId
                  difficulty
                  title
                  titleSlug
              }
          }
      }
      """


      headers = {
          "Content-Type": "application/json",
          "User-Agent": "Mozilla/5.0",
          "Referer": "https://leetcode.com/problemset/all/"
      }


      # ============================================================
      # STEP 3 — Fetch ALL problems using pagination
      # ============================================================

      difficulty_map = {}

      limit = 100
      skip = 0

      while True:

          payload = {
              "query": query,
              "variables": {
                  "categorySlug": "",
                  "limit": limit,
                  "skip": skip
              }
          }

          response = requests.post(
              graphql_url,
              json=payload,
              headers=headers,
              timeout=60
          )

          response.raise_for_status()

          result = response.json()


          # --------------------------------------------------------
          # Check GraphQL errors
          # --------------------------------------------------------

          if "errors" in result:

              print("")
              print(
                  "LeetCode GraphQL returned an error:"
              )

              print(result["errors"])

              raise RuntimeError(
                  "Unable to retrieve LeetCode problem data."
              )


          problemset = (
              result
              .get("data", {})
              .get("problemsetQuestionList")
          )


          if not problemset:

              raise RuntimeError(
                  "LeetCode returned no problem data."
              )


          questions = problemset.get(
              "questions",
              []
          )

          total_available = problemset.get(
              "total",
              0
          )


          # --------------------------------------------------------
          # Store difficulty
          # --------------------------------------------------------

          for question in questions:

              question_id = question.get(
                  "questionFrontendId"
              )

              difficulty = question.get(
                  "difficulty"
              )

              if not question_id:
                  continue

              try:
                  question_id = int(question_id)

              except (TypeError, ValueError):
                  continue

              difficulty_map[
                  question_id
              ] = difficulty


          print(
              f"Fetched {len(difficulty_map)} "
              f"problems..."
          )


          # --------------------------------------------------------
          # Stop when everything has been fetched
          # --------------------------------------------------------

          if (
              len(questions) == 0
              or
              skip + len(questions)
              >= total_available
          ):

              break


          skip += limit


      print("")
      print(
          f"Total LeetCode problems loaded: "
          f"{len(difficulty_map)}"
      )
      print("")


      # ============================================================
      # STEP 4 — Calculate difficulty statistics
      # ============================================================

      easy = 0
      medium = 0
      hard = 0

      unknown = []


      for problem_id in sorted(problem_ids):

          difficulty = difficulty_map.get(
              problem_id
          )


          if difficulty == "Easy":

              easy += 1


          elif difficulty == "Medium":

              medium += 1


          elif difficulty == "Hard":

              hard += 1


          else:

              unknown.append(problem_id)


      total = len(problem_ids)


      # ============================================================
      # STEP 5 — Display results
      # ============================================================

      print("")
      print("==============================================")
      print("        LEETCODE STATISTICS")
      print("==============================================")
      print("")
      print(f"🧠 Total  : {total}")
      print(f"🟢 Easy   : {easy}")
      print(f"🟡 Medium : {medium}")
      print(f"🔴 Hard   : {hard}")
      print("")


      if unknown:

          print(
              "⚠️ Difficulty not found for:"
          )

          print(
              ", ".join(
                  str(x)
                  for x in unknown
              )
          )

          print("")


      # ============================================================
      # STEP 6 — Read README
      # ============================================================

      if not README.exists():

          raise FileNotFoundError(
              "README.md does not exist."
          )


      readme = README.read_text(
          encoding="utf-8"
      )


      # ============================================================
      # STEP 7 — Update README markers
      # ============================================================

      def replace_marker(
          text,
          start_marker,
          end_marker,
          value
      ):

          pattern = (
              re.escape(start_marker)
              +
              r".*?"
              +
              re.escape(end_marker)
          )

          replacement = (
              start_marker
              +
              str(value)
              +
              end_marker
          )

          updated, count = re.subn(
              pattern,
              replacement,
              text,
              count=1,
              flags=re.DOTALL
          )


          if count != 1:

              raise RuntimeError(
                  f"README marker not found: "
                  f"{start_marker}"
              )


          return updated


      # ============================================================
      # Main statistics
      # ============================================================

      readme = replace_marker(
          readme,
          "<!-- TOTAL_START -->",
          "<!-- TOTAL_END -->",
          total
      )


      readme = replace_marker(
          readme,
          "<!-- EASY_START -->",
          "<!-- EASY_END -->",
          easy
      )


      readme = replace_marker(
          readme,
          "<!-- MEDIUM_START -->",
          "<!-- MEDIUM_END -->",
          medium
      )


      readme = replace_marker(
          readme,
          "<!-- HARD_START -->",
          "<!-- HARD_END -->",
          hard
      )


      # ============================================================
      # Difficulty progress section
      # ============================================================

      readme = replace_marker(
          readme,
          "<!-- EASY_PROGRESS_START -->",
          "<!-- EASY_PROGRESS_END -->",
          easy
      )


      readme = replace_marker(
          readme,
          "<!-- MEDIUM_PROGRESS_START -->",
          "<!-- MEDIUM_PROGRESS_END -->",
          medium
      )


      readme = replace_marker(
          readme,
          "<!-- HARD_PROGRESS_START -->",
          "<!-- HARD_PROGRESS_END -->",
          hard
      )


      # ============================================================
      # STEP 8 — Write README
      # ============================================================

      README.write_text(
          readme,
          encoding="utf-8"
      )


      print("")
      print(
          "✅ README successfully updated!"
      )
      print("")

      PY


  # ------------------------------------------------------------
  # Commit changes
  # ------------------------------------------------------------

  - name: Commit updated README
    run: |

      git config user.name \
        "github-actions[bot]"

      git config user.email \
        "41898282+github-actions[bot]@users.noreply.github.com"

      git add README.md


      if git diff --cached --quiet; then

          echo "No changes to README."

      else

          git commit \
            -m "chore: update LeetCode statistics"

          git push

      fi
```
